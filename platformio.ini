; ============================================================================
; PlatformIO-Konfiguration – ESP32 Victron VE.Direct
;
; Umgebungen:
;   esp32dev : Firmware für den ESP32-WROOM-32 (Standard)
;   native   : Unit-Tests auf dem PC (ohne ESP32, ohne Arduino)
;
; Wichtige Befehle (PlatformIO-Terminal):
;   pio run                    -> nur ESP32-Firmware bauen (default_envs)
;   pio run -t upload          -> Firmware bauen und flashen
;   pio device monitor         -> Debug-Ausgabe (UART0, 115200 Baud)
;   pio test -e esp32dev       -> Unit-Tests AUF DEM ESP32 ausführen
;                                 (Board muss per USB angeschlossen sein)
;   pio test -e native         -> Unit-Tests auf dem PC ausführen
;                                 (benötigt einen installierten GCC/G++)
;
; Dokumentation: https://docs.platformio.org/page/projectconf.html
; ============================================================================

[platformio]
; Ohne "-e" wird nur die ESP32-Firmware gebaut. Die PC-Umgebung "native"
; wird nur gezielt aufgerufen, damit ein fehlender PC-Compiler den normalen
; Build nicht stört.
default_envs = esp32dev


; ----------------------------------------------------------------------------
; ESP32-Firmware
; ----------------------------------------------------------------------------
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Debug-Konsole auf UART0 (USB). Muss zu Serial.begin() in main.cpp passen.
monitor_speed = 115200

; Eingetippte Zeichen im Monitor anzeigen (sonst tippt man "blind").
; Befehle: r1 ein | r1 aus | override ein | override aus | bloecke ein | bloecke aus | hilfe
monitor_echo = yes

; Testframework für "pio test -e esp32dev" (Tests liegen unter test/).
test_framework = unity

; Flash-Aufteilung: 2 × 1,5 MB App (Updates per WebUI) + 960 KB Dateisystem.
; Dateisystem LittleFS für die WebUI (Ordner data/).
;   Hochladen der WebUI-Dateien: pio run -t uploadfs
board_build.partitions = partitions_ota_littlefs.csv
board_build.filesystem = littlefs

; Bibliotheken nur für die Firmware (nicht für die PC-Tests):
;   GxEPD2: Treiber für das Waveshare 1.54" e-Paper V2 (SSD1681, 200×200).
;           Zieht Adafruit GFX (Schriften, Grafik) automatisch mit.
lib_deps =
    zinggjm/GxEPD2 @ ^1.5.0


; ----------------------------------------------------------------------------
; PC-Tests (Parser ohne Hardware prüfen)
;
; Getestet wird nur reiner C++-Code ohne Arduino-Abhängigkeit
; (z. B. VeDirectTextParser). Dateien, die Arduino benötigen, sind mit
; "#ifdef ARDUINO" geschützt (siehe VeDirectReader.cpp).
; ----------------------------------------------------------------------------
[env:native]
platform       = native
test_framework = unity

; Gleicher Sprachstandard wie der ESP32-Arduino-Core (gnu++11), damit auf
; dem PC kein Code getestet wird, der auf dem ESP32 nicht übersetzt.
; -Wall -Wextra: zusätzliche Compiler-Warnungen zur Fehlersuche.
build_flags =
    -std=gnu++11
    -Wall
    -Wextra
